services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_API_URL: http://127.0.0.1:4001

    container_name: stocks-nextjs

    ports:
      - "3000:3000"

    # environment:
    #   NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    #   NEXT_PUBLIC_API_URL: http://127.0.0.1:4001
    #   PORT: 3000

    env_file:
      - .env.local

    restart: unless-stopped

    networks:
      - stocks-network

networks:
  stocks-network:
    external: true
    name: stocks-network